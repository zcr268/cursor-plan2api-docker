name: Docker Build & Push

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Cursor-Plan2API source ref (branch/tag/commit)"
        required: false
        default: "master"
        type: string
      tag:
        description: "Override image tag (default: latest)"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SOURCE_REPO: alfons-fhl/Cursor-Plan2API

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.source_ref || 'master' }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
        continue-on-error: true
      - run: node scripts/sync-catalog-check.mjs
        continue-on-error: true

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.source_ref || 'master' }}

      - name: Patch Dockerfile — install Cursor CLI
        run: |
          # Cursor CLI 自带的 Node.js 是 glibc 编译的，Alpine (musl) 无法运行
          # 需要把基础镜像从 Alpine 换成 Debian
          sed -i 's/node:20-alpine/node:20-bookworm-slim/g' Dockerfile

          cat >> Dockerfile << 'PATCH'

          # ── Install Cursor CLI ──────────────────────────────────────
          RUN apt-get update && apt-get install -y --no-install-recommends curl ca-certificates && \
              curl https://cursor.com/install -fsS | bash && \
              apt-get purge -y curl && apt-get autoremove -y && \
              rm -rf /var/lib/apt/lists/*

          # Cursor CLI 安装到 ~/.local/bin/agent，Debian 默认 PATH 不包含此目录
          ENV PATH="${PATH}:/root/.local/bin"
          # ────────────────────────────────────────────────────────────
          PATCH

      - name: Verify patched Dockerfile
        run: |
          echo "=== Dockerfile ==="
          cat Dockerfile
          echo "=== Verify agent CLI install step ==="
          grep -q "cursor.com/install" Dockerfile && echo "OK: Cursor CLI install step present" || echo "FAIL: missing"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true